name: 🐛 Bug Report
description: Report a bug or unexpected behavior in FileForge
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in FileForge!
  - type: input
    id: package_version
    attributes:
      label: Package Version
      description: What version of the NuGet package are you using? (e.g. 1.0.0)
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: target_framework
    attributes:
      label: Target .NET Runtime
      options:
        - .NET 9.0
        - .NET 8.0
        - .NET Standard 2.0 / 2.1
        - Other (specify below)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - Cross-platform / All
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Please provide a minimal code snippet reproducing the problem.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Exception Stack Trace
      description: Full exception details and stack traces if applicable.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true